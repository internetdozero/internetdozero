name = "internetdozero-cron"
main = "src/index.js"
compatibility_date = "2026-09-16"

[triggers]
crons = ["0 11,17,23 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "internetdozero"
database_id = "7267907f-dd50-4046-9b2a-3a5758efdc45"

[[queues.producers]]
queue = "internetdozero-editorial"
binding = "internetdozero_editorial"

[[queues.consumers]]
queue = "internetdozero-editorial"

[vars]
SITE_URL = "https://internetdozero.com"
LOCAL_AI_URL = "https://ai.internetdozero.com.br"
LOCAL_AI_MODEL = "gemini-3.8-flash-medium"
AUTHOR = "Eduardo S."
AUTO_PUBLISH = "1"

# Secrets (set via wrangler secret put):
# OPENROUTER_API_KEY
# DEEPSEEK_API_KEY
# CRON_SECRET
# PEXELS_API_KEY (optional, curated landscape stock photos)
# UNSPLASH_ACCESS_KEY (optional, high quality editorial photos)
# PIXABAY_API_KEY (optional, photos & illustrations)

