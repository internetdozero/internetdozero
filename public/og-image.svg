<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#27272a" stroke-width="1.5" />

  <!-- Terminal Badge Top Left -->
  <g transform="translate(72, 72)">
    <rect width="110" height="38" rx="10" fill="#18181b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="20" cy="19" r="5" fill="#10b981" />
    <text x="34" y="25" fill="#10b981" font-family="monospace, monospace" font-size="15" font-weight="700">0x // IDZ</text>
  </g>

  <!-- Host Badge Top Right -->
  <g transform="translate(850, 72)">
    <rect width="278" height="38" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="24" y="24" fill="#a1a1aa" font-family="monospace, monospace" font-size="14" font-weight="600">internetdozero.com.br</text>
  </g>

  <!-- Main Headline -->
  <text x="72" y="235" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    INTERNET DO <tspan fill="url(#textGrad)">ZERO</tspan>
  </text>

  <!-- Subheading -->
  <text x="72" y="295" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400">
    Ferramentas locais gratuitas e blog sobre tecnologia independente.
  </text>
  <text x="72" y="335" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Sem cadastro, sem anúncios e sem enviar arquivos para servidores.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(72, 400)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="52" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="24" y="32" fill="#10b981" font-family="monospace, monospace" font-size="15" font-weight="700">⚡ 100% Local-First</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="260" height="52" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="24" y="32" fill="#38bdf8" font-family="monospace, monospace" font-size="15" font-weight="700">🔒 Privacidade Absoluta</text>

    <!-- Pill 3 -->
    <rect x="520" y="0" width="230" height="52" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="24" y="32" fill="#fbbf24" font-family="monospace, monospace" font-size="15" font-weight="700">🛠️ 10 Utilitários Web</text>

    <!-- Pill 4 -->
    <rect x="770" y="0" width="210" height="52" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="24" y="32" fill="#a78bfa" font-family="monospace, monospace" font-size="15" font-weight="700">📖 Blog &amp; Guias</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(72, 510)">
    <line x1="0" y1="0" x2="1056" y2="0" stroke="#27272a" stroke-width="1" />
    <text x="0" y="34" fill="#71717a" font-family="monospace, monospace" font-size="14">
      &gt; compressor webp · extrator audio · qr code · removedor exif · gerador senhas · diff checker
    </text>
  </g>
</svg>
